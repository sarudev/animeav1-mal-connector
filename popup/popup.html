<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>AnimeAv1 ↔ MAL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>AnimeAv1 ↔ MyAnimeList</h1>

      <section id="connection-status" class="status">Comprobando conexión con MAL…</section>

      <section id="page-context">
        <p id="no-context" hidden>Abre un capítulo de <strong>animeav1.com</strong> para vincularlo.</p>
        <div id="context-info" hidden>
          <p>Detectado: <strong id="detected-name">-</strong></p>
          <p>Slug: <code id="detected-slug">-</code></p>
        </div>
      </section>

      <section id="linked-view" hidden>
        <div class="anime-card">
          <img id="linked-image" class="anime-thumb" alt="" hidden />
          <p>
            ✅ Vinculado a
            <a id="linked-title" href="#" target="_blank" rel="noopener noreferrer">-</a>
            (ID <span id="linked-id">-</span>)
          </p>
        </div>
        <button id="change-link-btn" type="button">Cambiar vínculo</button>
      </section>

      <section id="link-view" hidden>
        <h2>Vincular anime</h2>

        <div class="search-row">
          <input id="search-input" type="text" placeholder="Nombre del anime" />
          <button id="search-btn" type="button">Buscar en MAL</button>
        </div>

        <ul id="search-results"></ul>

        <div class="manual-row">
          <label for="manual-id-input">ID de MAL (manual)</label>
          <input id="manual-id-input" type="number" min="1" placeholder="Ej: 21" />
        </div>

        <button id="confirm-link-btn" type="button" disabled>Vincular</button>
        <p id="link-error" class="error" hidden></p>
      </section>

      <footer>
        <a id="options-link" href="#">Configurar credenciales de MAL</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
