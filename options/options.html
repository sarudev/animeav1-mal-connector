<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Opciones - AnimeAv1 ↔ MAL</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Credenciales de MyAnimeList</h1>
      <p>
        Necesitas una app registrada en
        <a href="https://myanimelist.net/apiconfig" target="_blank" rel="noopener noreferrer">myanimelist.net/apiconfig</a>
        y un refresh token obtenido mediante el flujo OAuth2 de MAL.
      </p>

      <form id="auth-form">
        <label for="client-id">MAL_CLIENT_ID</label>
        <input id="client-id" type="text" autocomplete="off" required />

        <label for="client-secret">MAL_CLIENT_SECRET</label>
        <input id="client-secret" type="password" autocomplete="off" required />

        <label for="refresh-token">MAL_REFRESH_TOKEN</label>
        <input id="refresh-token" type="password" autocomplete="off" required />

        <div class="actions">
          <button type="submit">Guardar</button>
          <button id="test-btn" type="button">Probar conexión</button>
        </div>
      </form>

      <p id="status-msg" class="status" hidden></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
